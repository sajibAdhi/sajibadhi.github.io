<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prism-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0080" />
      <stop offset="50%" style="stop-color:#7928ca" />
      <stop offset="100%" style="stop-color:#00f2ff" />
    </linearGradient>
    <style>
      .monogram { 
        font-family: 'Geist Mono', 'Inter', 'Segoe UI', monospace; 
        font-weight: 900; 
        font-size: 240px; 
        letter-spacing: -15px;
      }
      .cursor {
        fill: #ff0080;
      }
    </style>
  </defs>

  <!-- High-End Rounded Base -->
  <rect width="512" height="512" rx="140" fill="#000000"/>
  
  <!-- Subtle Glass Polish -->
  <rect x="10" y="10" width="492" height="492" rx="130" stroke="white" stroke-width="1" opacity="0.1"/>

  <!-- Typographic Mark -->
  <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" class="monogram">
    <tspan fill="white">S</tspan><tspan fill="url(#prism-grad)">A</tspan>
  </text>

  <!-- The Developer Accent (Underscore) -->
  <rect x="216" y="360" width="80" height="20" rx="4" class="cursor">
    <animate attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite" />
  </rect>

  <!-- Corner Precision Accents -->
  <circle cx="60" cy="60" r="4" fill="white" opacity="0.2"/>
  <circle cx="452" cy="452" r="4" fill="white" opacity="0.2"/>
</svg>
